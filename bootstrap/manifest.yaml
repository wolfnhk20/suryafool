dependencies:
- name: homebrew
  platforms:
  - macos
  check_cmd: which brew
  expect_exit_code: 0
  install_cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  requires_elevation: none
  depends_on: []
- name: wsl2
  platforms:
  - windows
  check_cmd: 'wsl --status | findstr "Default Version: 2"'
  expect_exit_code: 0
  install_cmd: wsl --install --no-launch
  requires_elevation: windows_admin
  depends_on: []
- name: wsl-ubuntu
  platforms:
  - windows
  check_cmd: wsl -d Ubuntu -- echo ok
  expect_contains: ok
  install_cmd: wsl --install -d Ubuntu
  repair_cmd: cmd /c "wsl --unregister Ubuntu && wsl --install -d Ubuntu --web-download"
  requires_elevation: windows_admin
  depends_on:
  - wsl2
- name: wsl-ubuntu-v2
  platforms:
  - windows
  check_cmd: powershell -Command "wsl -l -v | Select-String -SimpleMatch Ubuntu | Select-String -SimpleMatch 2"
  expect_exit_code: 0
  install_cmd: wsl --set-version Ubuntu 2
  requires_elevation: none
  depends_on:
  - wsl-ubuntu
- name: usbipd
  platforms:
  - windows
  check_cmd: usbipd list
  expect_exit_code: 0
  install_cmd: winget install --id dorssel.usbipd-win -e
  requires_elevation: windows_admin
  depends_on: []
- name: usb-passthrough
  platforms:
  - windows
  check_cmd: wsl -d Ubuntu -- which lsusb
  expect_contains: /usr/bin/lsusb
  install_cmd: wsl -d Ubuntu -- bash -c "sudo apt update && sudo apt install -y usbutils" && usbipd attach --wsl Ubuntu
  requires_elevation: wsl_sudo
  depends_on:
  - wsl-ubuntu
  - usbipd
- name: aircrack-ng
  platforms:
  - windows
  - linux
  - macos
  check_cmd:
    windows: wsl -d Ubuntu -- which airmon-ng
    linux: which airmon-ng
    macos: which airmon-ng
  expect_exit_code: 0
  install_cmd:
    windows: wsl -d Ubuntu -- bash -c "sudo apt update && sudo apt install -y aircrack-ng"
    linux: sudo apt update && sudo apt install -y aircrack-ng
    macos: brew install aircrack-ng
  requires_elevation: wsl_sudo
  depends_on:
    windows:
    - wsl-ubuntu
    linux: []
    macos:
    - homebrew
- name: python3
  platforms:
  - windows
  - linux
  - macos
  check_cmd:
    windows: wsl -d Ubuntu -- python3 --version
    linux: python3 --version
    macos: python3 --version
  expect_contains: Python 3
  install_cmd:
    windows: wsl -d Ubuntu -- bash -c "sudo apt update && sudo apt install -y python3 python3-pip"
    linux: sudo apt update && sudo apt install -y python3 python3-pip
    macos: brew install python3
  requires_elevation: wsl_sudo
  depends_on:
    windows:
    - wsl-ubuntu
    linux: []
    macos:
    - homebrew
- name: scapy
  platforms:
  - windows
  - linux
  - macos
  check_cmd:
    windows: wsl -d Ubuntu -- python3 -c "import scapy; print('ok')"
    linux: python3 -c "import scapy; print('ok')"
    macos: python3 -c "import scapy; print('ok')"
  expect_contains: ok
  install_cmd:
    windows: wsl -d Ubuntu -- pip install scapy --break-system-packages
    linux: pip install scapy --break-system-packages
    macos: pip3 install scapy
  requires_elevation: none
  depends_on:
    windows:
    - python3
    linux:
    - python3
    macos:
    - python3
- name: python-deps
  platforms:
  - windows
  - linux
  - macos
  check_cmd:
    windows: wsl -d Ubuntu -- python3 -c "import langchain, langgraph, langchain_nvidia_ai_endpoints, yaml, rich; print('ok')"
    linux: python3 -c "import langchain, langgraph, langchain_nvidia_ai_endpoints, yaml, rich; print('ok')"
    macos: python3 -c "import langchain, langgraph, langchain_nvidia_ai_endpoints, yaml, rich; print('ok')"
  expect_contains: ok
  install_cmd:
    windows: wsl -d Ubuntu -- pip install langchain langgraph langchain-nvidia-ai-endpoints langchain-groq pyyaml rich --break-system-packages
    linux: pip install langchain langgraph langchain-nvidia-ai-endpoints langchain-groq pyyaml rich --break-system-packages
    macos: pip3 install langchain langgraph langchain-nvidia-ai-endpoints langchain-groq pyyaml rich
  requires_elevation: none
  depends_on:
    windows:
    - python3
    linux:
    - python3
    macos:
    - python3